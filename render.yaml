services:
  - type: web
    name: trustlayer-engine
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r engine/requirements.txt
    startCommand: uvicorn engine.app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- Provider config (Gemini via Vertex AI is the demo default) ---
      - key: DEFAULT_PROVIDER
        value: google
      - key: DEFAULT_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_USE_VERTEX
        value: "true"
      - key: GEMINI_PROJECT
        value: project-14eb89f6-442e-47d4-982
      - key: GEMINI_LOCATION
        value: global
      - key: GEMINI_MODEL
        value: gemini-3.1-pro-preview
      - key: GEMINI_FAST_MODEL
        value: gemini-3-flash-preview
      # Paste the full service-account JSON (the file contents) here in the
      # Render dashboard. Don't commit it.
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # --- Anthropic kept as a fallback provider ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MAX_TOKENS
        value: "16384"
      - key: ENGINE_ENV
        value: production
      - key: ENGINE_LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "https://conti-nu.vercel.app"
      - key: TRUST_PROXY_HEADERS
        value: "true"

  - type: web
    name: trustlayer-contract-demo
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r demo-app/backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir demo-app/backend
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- Provider config (Gemini via Vertex AI; multimodal contract demo) ---
      - key: DEFAULT_PROVIDER
        value: google
      - key: DEFAULT_MODEL
        value: gemini-3.1-pro-preview
      - key: GEMINI_USE_VERTEX
        value: "true"
      - key: GEMINI_PROJECT
        value: project-14eb89f6-442e-47d4-982
      - key: GEMINI_LOCATION
        value: global
      - key: GEMINI_MODEL
        value: gemini-3.1-pro-preview
      - key: GEMINI_FAST_MODEL
        value: gemini-3-flash-preview
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # --- Anthropic kept as a fallback provider ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MAX_TOKENS
        value: "16384"
      - key: TRUSTLAYER_BASE_URL
        fromService:
          type: web
          name: trustlayer-engine
          property: hostport
      - key: CORS_ORIGINS
        value: "https://conti-nu.vercel.app"
      - key: DEMO_LOG_LEVEL
        value: INFO
